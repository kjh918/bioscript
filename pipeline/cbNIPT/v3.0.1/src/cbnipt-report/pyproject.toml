[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbnipt-report"
version = "0.1.0"
description = "cbNIPT clinical karyotype report module (karyotype_viewer v2): FastAPI + Dash-Bio viewer and static HTML report"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "dash>=2.17",
    "dash-bio>=1.0",
    "plotly>=5.22",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.scripts]
karyotype-viewer = "karyotype_viewer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/karyotype_viewer"]
